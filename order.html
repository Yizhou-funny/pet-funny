<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Profile — QR Tag</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#f3f4f6;min-height:100vh;padding:20px 14px}
.langfix{position:fixed;top:10px;right:10px;z-index:9;background:rgba(255,255,255,.95);border:1px solid #e5e7eb;border-radius:10px;padding:5px 8px;font-size:13px;color:#1f2937;cursor:pointer;font-weight:600;max-width:150px}
.box{max-width:560px;margin:36px auto 0}
h1{font-size:21px;color:#111827;margin-bottom:4px}
.sub{font-size:13.5px;color:#6b7280;margin-bottom:16px;line-height:1.6}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13.5px;color:#374151;margin:13px 0 5px;font-weight:600}
label small{color:#9ca3af;font-weight:400}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
input:focus,textarea:focus{border-color:#2563eb;outline:none}
textarea{resize:vertical;min-height:56px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:16.5px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff;margin-top:18px;font-family:inherit}
.btn:active{background:#1d4ed8}
.out{display:none}
.qrwrap{display:flex;gap:18px;align-items:center;margin-top:8px}
.qr{width:180px;height:180px;flex:none;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
.info{font-size:13.5px;color:#6b7280;line-height:2}
.info b{color:#111827}
.urlbox{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;font-size:11px;word-break:break-all;color:#6b7280;margin-top:12px;max-height:64px;overflow:auto}
.stepbox{background:#dbeafe;border-radius:12px;padding:13px;font-size:14px;color:#1e40af;line-height:1.9;margin-top:14px}
.stepbox b{color:#1d4ed8}
@media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<select class="langfix" id="langsel"></select>
<div class="box">
<h1 id="t_title"></h1>
<div class="sub" id="t_sub"></div>

<div class="card">
  <div class="row">
    <div><label id="t_lname"></label><input id="n" placeholder="Рекс"></div>
    <div><label id="t_lemo"></label><input id="e" list="emojis" maxlength="4" value="🐾" style="font-size:20px">
      <datalist id="emojis"><option>🐕</option><option>🐈</option><option>🐇</option><option>🦜</option><option>🐹</option><option>🐢</option><option>🐠</option><option>🐍</option><option>🦔</option><option>🐴</option><option>🐾</option><option>❤️</option></datalist></div>
  </div>
  <div class="row">
    <div><label id="t_lbreed"></label><input id="b" placeholder="Овчарка · 5 лет"></div>
    <div><label id="t_lphone"></label><input id="p" placeholder="+79990000000"></div>
  </div>
  <div class="row">
    <div><label id="t_lwa"></label><input id="w" placeholder="79990000000"></div>
    <div><label id="t_ltg"></label><input id="tg" placeholder="username"></div>
  </div>
  <label id="t_linfo"></label>
  <textarea id="i"></textarea>
  <button class="btn" id="t_btn" onclick="gen()"></button>
</div>

<div class="card out" id="out">
  <b style="font-size:16px" id="t_ready"></b>
  <div style="text-align:center"><img class="qr" id="qr" alt="QR" style="margin:0 auto"></div>
  <div class="stepbox" id="t_steps"></div>
  <div class="urlbox" id="url"></div>
</div>

<div style="text-align:center;font-size:12px;color:#9ca3af;margin-top:8px">PET-Funny · QR Pet Tag</div>
</div>

const LANGS=Object.keys(L);
let cur=localStorage.getItem('olang');
if(!cur||LANGS.indexOf(cur)<0){cur=(navigator.language||'ru').slice(0,2).toLowerCase();if(LANGS.indexOf(cur)<0)cur='ru'}

function applyLang(){
  const t=L[cur];
  document.getElementById('langsel').innerHTML=LANGS.map(k=>'<option value="'+k+'"'+(k===cur?' selected':'')+'>'+L[k].n+'</option>').join('');
  const map={t_title:t.title,t_sub:t.sub,t_lname:t.lname,t_lemo:t.lemo,t_lbreed:t.lbreed,t_lphone:t.lphone,
    t_lwa:t.lwa,t_ltg:t.ltg,t_linfo:t.linfo,t_btn:t.btn,t_ready:t.ready,t_steps:t.steps};
  for(const id in map)document.getElementById(id).innerHTML=map[id];
  document.getElementById('n').placeholder=t.ph_name;
  document.getElementById('b').placeholder=t.ph_breed;
  if(!document.getElementById('i').value||document.getElementById('i').dataset.def==='1'){document.getElementById('i').value=t.info_def;document.getElementById('i').dataset.def='1'}
}
document.getElementById('langsel').addEventListener('change',function(){cur=this.value;try{localStorage.setItem('olang',cur)}catch(e){};applyLang()});
applyLang();

function b64e(s){const b=new TextEncoder().encode(s);let r='';b.forEach(x=>r+=String.fromCharCode(x));
  return btoa(r).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function gen(){
  const v=id=>document.getElementById(id).value.trim();
  if(!v('n')||(!v('p')&&!v('w')&&!v('tg'))){alert(L[cur].req);return}
  const items=v('i').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]&&a[1]);
  const d={n:v('n'),b:v('b'),p:v('p'),t:'',e:v('e')||'🐾',i:items};
  if(v('w'))d.w=v('w');
  if(v('tg'))d.tg=v('tg').replace(/^@/,'');
  const base=location.href.replace(/[^/]*$/,'pet.html');
  const url=base+'#'+b64e(JSON.stringify(d));
  document.getElementById('url').textContent=url;
  document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data='+encodeURIComponent(url);
    document.getElementById('out').style.display='block';
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
