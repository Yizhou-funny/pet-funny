<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Profile — QR Tag</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#f3f4f6;min-height:100vh;padding:20px 14px}
.langfix{position:fixed;top:10px;right:10px;z-index:9;background:rgba(255,255,255,.95);border:1px solid #e5e7eb;border-radius:10px;padding:5px 8px;font-size:13px;color:#1f2937;cursor:pointer;font-weight:600;max-width:150px}
.box{max-width:560px;margin:36px auto 0}
h1{font-size:21px;color:#111827;margin-bottom:4px}
.sub{font-size:13.5px;color:#6b7280;margin-bottom:16px;line-height:1.6}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13.5px;color:#374151;margin:13px 0 5px;font-weight:600}
label small{color:#9ca3af;font-weight:400}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
input:focus,textarea:focus{border-color:#2563eb;outline:none}
textarea{resize:vertical;min-height:56px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:16.5px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff;margin-top:18px;font-family:inherit}
.btn:active{background:#1d4ed8}
.out{display:none}
.qrwrap{display:flex;gap:18px;align-items:center;margin-top:8px}
.qr{width:180px;height:180px;flex:none;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
.info{font-size:13.5px;color:#6b7280;line-height:2}
.info b{color:#111827}
.urlbox{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:8px 10px;font-size:11px;word-break:break-all;color:#6b7280;margin-top:12px;max-height:64px;overflow:auto}
.stepbox{background:#dbeafe;border-radius:12px;padding:13px;font-size:14px;color:#1e40af;line-height:1.9;margin-top:14px}
.stepbox b{color:#1d4ed8}
@media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>

function b64e(s){const b=new TextEncoder().encode(s);let r='';b.forEach(x=>r+=String.fromCharCode(x));
  return btoa(r).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

/* ==== windows-1251 紧凑编码：俄文1字节/字符，二维码容量近翻倍；旧二维码无~前缀仍按UTF-8解码，完全兼容 ==== */
var CP1251_HI=[1026,1027,8218,1107,8222,8230,8224,8225,8364,8240,1033,8249,1034,1036,1035,1039,1106,8216,8217,8220,8221,8226,8211,8212,65533,8482,1113,8250,1114,1116,1115,1119,160,1038,1118,1032,164,1168,166,167,1025,169,1028,171,172,173,174,1031,176,177,1030,1110,1169,181,182,183,1105,8470,1108,187,1112,1029,1109,1111,1040,1041,1042,1043,1044,1045,1046,1047,1048,1049,1050,1051,1052,1053,1054,1055,1056,1057,1058,1059,1060,1061,1062,1063,1064,1065,1066,1067,1068,1069,1070,1071,1072,1073,1074,1075,1076,1077,1078,1079,1080,1081,1082,1083,1084,1085,1086,1087,1088,1089,1090,1091,1092,1093,1094,1095,1096,1097,1098,1099,1100,1101,1102,1103];
function enc1251(s){
  var out=[];
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c<128){out.push(c);continue}
    var found=false;
    for(var b=128;b<256;b++){if(CP1251_HI[b-128]===c){out.push(b);found=true;break}}
    if(!found)return null;
  }
  return out;
}
function packData(d){
  var json=JSON.stringify(d);
  var c=enc1251(json);
  if(c){var s=String.fromCharCode.apply(null,c);return '~'+btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  return b64e(json);
}

      for (var j = 0; j < ap.length; j++) {
        var rr = ap[i], cc = ap[j];
        if (isFunc[rr] && isFunc[rr][cc]) continue; /* 与寻像图形重叠处跳过 */
        for (var r = -2; r <= 2; r++)
          for (var c = -2; c <= 2; c++)
            setF(rr + r, cc + c, Math.max(Math.abs(r), Math.abs(c)) !== 1);
      }
    /* 时序图形 */
    for (var i = 8; i < size - 8; i++) {
      if (!isFunc[6][i]) setF(6, i, i % 2 === 0);
      if (!isFunc[i][6]) setF(i, 6, i % 2 === 0);
    }
    /* 格式信息占位（先按 mask=0 放，最终再覆盖） */
    function setupFormat(fbits) {
      for (var i = 0; i < 15; i++) {
        var mod = ((fbits >> i) & 1) === 1;
        if (i < 6) setF(i, 8, mod);
        else if (i < 8) setF(i + 1, 8, mod);
        else setF(size - 15 + i, 8, mod);
        if (i < 8) setF(8, size - i - 1, mod);
        else if (i < 9) setF(8, 15 - i - 1 + 1, mod);
        else setF(8, 15 - i - 1, mod);
      }
      setF(size - 8, 8, true); /* 固定暗模块 */
    }
    function formatBits(mask) {
      var data = (0x2 << 3) | mask; /* H = 0b10 */
      var d = data << 10;
      for (var i = 14; i >= 10; i--)
        if ((d >>> i) & 1) d ^= 0x537 << (i - 10);
      return ((data << 10) | (d & 0x3FF)) ^ 0x5412;
    }
    setupFormat(formatBits(0));
    /* 版本信息 v>=7 */
    if (version >= 7) {
      var rem = version;
      for (var i = 0; i < 12; i++)
        rem = ((rem << 1) ^ (((rem >>> 11) & 1) ? 0x1F25 : 0)) & 0xFFFFF;
      var vbits = (version << 12) | rem;
      for (var i = 0; i < 18; i++) {
        var mod = ((vbits >> i) & 1) === 1;
        var a = Math.floor(i / 3), b = i % 3 + size - 11;
        setF(a, b, mod); setF(b, a, mod);
      }
    }

    /* 数据填充（之字形）+ 试 8 种掩码选最优 */
    function mapData(maskFn) {
      var inc = -1, row = size - 1, bitIdx = 7, byteIdx = 0;
      for (var col = size - 1; col > 0; col -= 2) {
        if (col === 6) col--;
        while (true) {
          for (var c = 0; c < 2; c++) {
            var cc = col - c;
            if (!isFunc[row][cc]) {
              var dark = false;
              if (byteIdx < finalBytes.length)
                dark = ((finalBytes[byteIdx] >>> bitIdx) & 1) === 1;
              if (maskFn(row, cc)) dark = !dark;
              modules[row][cc] = dark;
              bitIdx--;
              if (bitIdx === -1) { byteIdx++; bitIdx = 7; }
            }
          }
          row += inc;
          if (row < 0 || row >= size) { row -= inc; inc = -inc; break; }
        }
      }
    }
    function penalty() {
      var p = 0, r, c;
      /* 规则1：同行/列连续 ≥5 个同色 */
      for (r = 0; r < size; r++) {
        var run = 1;
        for (c = 1; c < size; c++) {
          if (modules[r][c] === modules[r][c - 1]) run++;
          else { if (run >= 5) p += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) p += 3 + (run - 5);
      }
      for (c = 0; c < size; c++) {
        var run = 1;
        for (r = 1; r < size; r++) {
          if (modules[r][c] === modules[r - 1][c]) run++;
          else { if (run >= 5) p += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) p += 3 + (run - 5);
      }
      /* 规则2：2x2 同色块 */
      for (r = 0; r < size - 1; r++)
        for (c = 0; c < size - 1; c++)
          if (modules[r][c] === modules[r][c + 1] &&
              modules[r][c] === modules[r + 1][c] &&
              modules[r][c] === modules[r + 1][c + 1]) p += 3;
      /* 规则3：1:1:3:1:1 加四连白 */
      for (r = 0; r < size; r++)
        for (c = 0; c < size - 6; c++)
          if (modules[r][c] && !modules[r][c + 1] && modules[r][c + 2] &&
              modules[r][c + 3] && modules[r][c + 4] && !modules[r][c + 5] && modules[r][c + 6]) {
            var before = c >= 4 && !modules[r][c - 1] && !modules[r][c - 2] && !modules[r][c - 3] && !modules[r][c - 4];
            var after = c + 11 <= size && !modules[r][c + 7] && !modules[r][c + 8] && !modules[r][c + 9] && !modules[r][c + 10];
            if (before || after) p += 40;
          }
      for (c = 0; c < size; c++)
        for (r = 0; r < size - 6; r++)
          if (modules[r][c] && !modules[r + 1][c] && modules[r + 2][c] &&
              modules[r + 3][c] && modules[r + 4][c] && !modules[r + 5][c] && modules[r + 6][c]) {
            var before = r >= 4 && !modules[r - 1][c] && !modules[r - 2][c] && !modules[r - 3][c] && !modules[r - 4][c];
            var after = r + 11 <= size && !modules[r + 7][c] && !modules[r + 8][c] && !modules[r + 9][c] && !modules[r + 10][c];
            if (before || after) p += 40;
          }
      /* 规则4：黑白比例 */
      var dark = 0;
      for (r = 0; r < size; r++) for (c = 0; c < size; c++) if (modules[r][c]) dark++;
      var total = size * size;
      p += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
      return p;
    }

    var bestMask = 0, bestScore = Infinity;
    for (var m = 0; m < 8; m++) {
      mapData(MASKS[m]);
      var s = penalty();
      if (s < bestScore) { bestScore = s; bestMask = m; }
    }
    mapData(MASKS[bestMask]);
    setupFormat(formatBits(bestMask));

    var out = [];
    for (var r = 0; r < size; r++) {
      var rowArr = [];
      for (var c = 0; c < size; c++) rowArr.push(modules[r][c] ? 1 : 0);
      out.push(rowArr);
    }
    return { size: size, modules: out, version: version, mask: bestMask };
  }

  /* 画到 canvas：scale=每模块像素, 含静默区 quiet 模块 */
  function draw(canvas, qr, scale, quiet, logoImg) {
    var n = qr.size + quiet * 2;
    canvas.width = canvas.height = n * scale;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    for (var r = 0; r < qr.size; r++)
      for (var c = 0; c < qr.size; c++)
        if (qr.modules[r][c])
          ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
    if (logoImg) {
      var area = canvas.width * (logoImg.frac || 0.25);
      var x = (canvas.width - area) / 2, y = (canvas.height - area) / 2;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x - area * 0.12, y - area * 0.12, area * 1.24, area * 1.24, area * 0.2);
      else ctx.rect(x - area * 0.12, y - area * 0.12, area * 1.24, area * 1.24);
      ctx.fill();
      ctx.drawImage(logoImg.img, x, y, area, area);
    }
    return canvas;
  }

  return { make: make, draw: draw };
})();



function buildQR(url){
  try{
    const qr=QRLocal.make(url);
    const cv=document.createElement('canvas');
    const scale=Math.max(2, Math.floor(460/(qr.size+8)));
    const lg=new Image();
    lg.onload=function(){
      QRLocal.draw(cv, qr, scale, 4, {img:lg, frac:0.26});
      document.getElementById('qr').src=cv.toDataURL('image/png');
    };
    lg.onerror=function(){ QRLocal.draw(cv, qr, scale, 4, null); document.getElementById('qr').src=cv.toDataURL('image/png'); };
    lg.src=LOGO_B64;
  }catch(e){ alert((typeof L!=='undefined'? 'QR error: ':'二维码生成失败: ')+e.message); }
}

function gen(){
  const v=id=>document.getElementById(id).value.trim();
  if(!v('n')||(!v('p')&&!v('w')&&!v('tg'))){alert(L[cur].req);return}
  const items=v('i').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]&&a[1]);
  const d={n:v('n'),b:v('b'),p:v('p'),t:'',e:v('e')||'🐾',i:items};
  if(v('w'))d.w=v('w');
  if(v('tg'))d.tg=v('tg').replace(/^@/,'');
  const base=location.href.replace(/[^/]*$/,'tag-x7k2m9d2.html');
  const url=base+'#'+packData(d);
  if(url.length>380){alert('Content too long ('+url.length+' chars). QR code would be too dense to scan. Please remove some info lines.');return}
  document.getElementById('url').textContent=url;
  buildQR(url);
    document.getElementById('out').style.display='block';
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
}
