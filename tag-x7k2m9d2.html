<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:#f3f4f6;max-width:480px;margin:0 auto;min-height:100vh}
.langfix{position:fixed;top:10px;right:10px;z-index:9;background:rgba(255,255,255,.95);border:1px solid #e5e7eb;border-radius:10px;padding:5px 8px;font-size:13px;color:#1f2937;cursor:pointer;font-weight:600}
.head{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;text-align:center;padding:28px 18px 46px}
.ava{width:112px;height:112px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:58px;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.85)}
.name{font-size:27px;font-weight:700;word-break:break-word}
.breed{display:inline-block;margin-top:10px;padding:6px 16px;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.55);border-radius:999px;font-size:16px;font-weight:600;opacity:1;word-break:break-word}
.body{padding:0 14px;margin-top:-26px;padding-bottom:20px}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;margin-bottom:12px}
.call{background:#16a34a;color:#fff}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:9px;color:#111827}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:#6b7280;gap:12px}
.kv b{color:#1f2937;font-weight:500;text-align:right;word-break:break-word}
.found{background:#fef9c3;border-radius:14px;padding:14px;text-align:center;font-size:14px;color:#92400e;line-height:1.6}
.foot{text-align:center;font-size:12px;color:#9ca3af;padding:8px 0 20px}
.foot a{color:#2563eb;text-decoration:none}
.err{text-align:center;padding:60px 20px;color:#6b7280;font-size:15px;line-height:1.8}
</style>
</head>

/* ★ 安全存储：内置浏览器禁用localStorage时也不报错 ★ */
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
  const bin=atob(s),b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(b)}
